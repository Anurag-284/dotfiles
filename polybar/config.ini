; ==========================================================
;   Floating "Pill" Themed Polybar Configuration
; ==========================================================
[settings]
screenchange-reload = true
pseudo-transparency = true
; We are leaving IPC disabled as it's unreliable on your system.
; Import our colors and modules
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini
; ----------------------------------------------------------
;   Master Bar Settings (to be inherited by all other bars)
; ----------------------------------------------------------
[bar/base]
; This makes the bar a floating window instead of docking.
override-redirect = true
; Place the bar at the top of the screen
bottom = false
; General appearance and theming
height = 35
radius = 12.0
fixed-center = true
background = ${colors.bg-transparent}
foreground = ${colors.foreground}
padding = 2
module-margin = 2
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
font-1 = "JetBrainsMono Nerd Font:size=14;5"
wm-restack = i3
; ----------------------------------------------------------
;   Individual Bar Definitions
; ----------------------------------------------------------
[bar/workspaces]
inherit = bar/base
; --- Position & Size ---
width = 15%
offset-x = 0%
offset-y = 10
; --- Modules ---
modules-center = i3

[bar/media]
inherit = bar/base
width = 20%
offset-x = 18%
offset-y = 10
modules-center =spacer browser-player spacer mpc-prev mpc-playpause mpc-next music-folder mpc-stop spacer


[bar/sysinfo]
inherit = bar/base
width = 35%
offset-x = 65%
offset-y = 10
modules-center = spacer date cpu memory volume battery powermenu spacer

[bar/network]
inherit = bar/base
; --- Position & Size ---
width = 11%
offset-x = 53%
offset-y = 10
; --- Modules ---
modules-center = wifi bluetooth


[bar/apps]
inherit = bar/base
; --- Position & Size ---
width = 12%
offset-x = 40%
offset-y = 10
; --- Modules ---
modules-center = spacer discord kitty files browser spacer
