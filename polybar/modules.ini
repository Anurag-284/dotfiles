; ==========================================================
;   Modules for the "Pill" Themed Polybar
; ==========================================================

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false  ; <-- We will show the numbers now
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

; Use a consistent icon for all workspaces
; You can change this to any Nerd Font icon you like (e.g., , , )
icon-default = ""

; The format will now include the name (the number) and the icon
format = <label-state>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.alert}

; --- Style for the FOCUSED workspace ---
; This is the one you are currently on.
; It will show the number, have a colored background, and bright text.
label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2

; --- Style for VISIBLE workspaces ---
; (Workspaces on other monitors)
label-visible = %name%
label-visible-underline = ${colors.foreground-alt}
label-visible-padding = 2

; --- Style for URGENT workspaces ---
; (e.g., A notification from an app on another workspace)
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

; --- Style for UNOCCUPIED / UNFOCUSED workspaces ---
; It will show the number, but with a muted, disabled color.
label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

; ==========================================================
;   Universal Playerctl Modules
; ==========================================================

[module/mpc-playpause]
type = custom/script
exec = mpc --host="/home/anurag/.config/mpd/socket" status | grep -q "playing" && echo "󰏤" || echo "󰐊"
tail=true
click-left = mpc --host="/home/anurag/.config/mpd/socket" toggle &

[module/mpc-prev]
type = custom/text
content = "󰒮"
click-left = mpc --host="/home/anurag/.config/mpd/socket" prev &

[module/mpc-next]
type = custom/text
content = "󰒭"
click-left = mpc --host="/home/anurag/.config/mpd/socket" next &

[module/mpc-stop]
type = custom/text
content = "󰙧"
click-left = mpc --host="/home/anurag/.config/mpd/socket" stop && mpc --host="/home/anurag/.config/mpd/socket" clear &

[module/browser-player]
type = custom/script
exec = ~/.config/polybar/Scripts/browser_player.sh
tail = true
click-left = playerctl play-pause &
click-right = playerctl stop &
scroll-up = playerctl next &
scroll-down = playerctl previous &


[module/music-folder]
type = custom/text
content = "󰉋"
click-left = mpc --host="/home/anurag/.config/mpd/socket" clear && mpc --host="/home/anurag/.config/mpd/socket" add / && mpc --host="/home/anurag/.config/mpd/socket" play &





[module/date]
type = internal/date
interval = 5
date = " %a, %b %d"
time = " %H:%M"
format-prefix-foreground = ${colors.primary}
label = %date%  %time%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/battery]
type = custom/script
exec = ~/.config/polybar/Scripts/battery_status.sh
interval = 30

[module/volume]
type = internal/pulseaudio

use-ui-max = false
interval = 5

; --- THIS IS THE MAIN CHANGE ---
; We wrap the format in a click action tag %{A1:...:}
; A1 means Action for Left Click.
; The command to run is 'pavucontrol'.
format-volume = %{A1:pavucontrol:} <ramp-volume> <label-volume> %{A}

; We do the same for the muted format, so it's also clickable.
format-muted = %{A1:pavucontrol:} <label-muted> %{A}
format-muted-prefix = "󰸈 "
format-muted-prefix-foreground = ${colors.disabled}

label-volume = %percentage%%
label-muted = Muted
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}


[module/powermenu]
type = custom/text
content = ""
click-left = ~/.config/i3/powermenu.sh
format-padding = 4


[module/systray]
type = internal/tray

[module/spacer]
type = custom/text
content = " "

; ==========================================================
;   The "Impossible to Fail" Network Modules
; ==========================================================

[module/wifi]
type = custom/text
; Just a static Wi-Fi icon
content = "󰖩"
content-foreground = ${colors.primary}
; Left-click to open the rofi network manager
click-left =kitty nmtui &

[module/bluetooth]
type = custom/text
; Just a static Bluetooth icon
content = "󰂯"
content-foreground = ${colors.primary}
; Left-click to open the graphical bluetooth manager
click-left = blueman-manager &



; ============================================
;   App Launcher Modules
; ============================================

[module/discord]
type = custom/text
content = "󰙯"
click-left = discord &

[module/files]
type = custom/text
content = "󰉋"
click-left = thunar &

[module/browser]
type = custom/text
content = "󰈹"
click-left = firefox &
format-padding = 2

[module/kitty]
type = custom/text
content = ""
click-left = kitty &
